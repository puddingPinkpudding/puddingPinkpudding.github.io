<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pink Pudding Studio</title>
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        .logo-gif { width: 100%; max-width: 450px; height: auto; margin: 20px auto; display: block; border-radius: 10px; }
        .description { font-size: 18px; color: #ccc; max-width: 600px; margin: 0 auto 30px auto; line-height: 1.6; }
        .gallery { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }
        .card { background: #1e1e1e; padding: 15px; border-radius: 8px; width: 300px; }
        img { width: 100%; border-radius: 5px; display: block; height: auto; }
        p { font-size: 14px; color: #aaa; margin-top: 10px; }
    </style>
</head>
<body>

  
    <img src="logo.gif" alt="Pink Pudding Studio Logo" class="logo-gif">
    
    <p class="description">Hi! This is my solo studio; I simply share my drawings, animations, and memes here. I hope someone finds inspiration on my site!🍮</p>

    <div class="gallery">
        
        <div class="card">
            <img src="pudya.png" alt="Pudya">
            <p>Meet Pudya, the studio mascot! My very first drawing here.</p>
        </div>
    </div>

</body>
</html>
