<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pink Pudding Studio</title>
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        h1 { color: #ff69b4; }
        .logo-gif { max-width: 450px; width: 100%; border-radius: 10px; }
        .gallery { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 20px; }
        .card { background: #1e1e1e; padding: 10px; border-radius: 10px; width: 280px; }
        .card img { width: 100%; border-radius: 5px; }
        .profile-container { max-width: 600px; margin: 20px auto; padding: 20px; background: #1e1e1e; border-radius: 10px; text-align: left; }
        .archive-title { color: #ff69b4; margin-top: 30px; }
    </style>
</head>
<body>
    <h1>ピンクプリンスタジオ (Pink Pudding Studio)</h1>
    <img src="logo.gif" alt="Logo" class="logo-gif">
    <p>Hi! This is my solo studio... 🍮</p>

   
    <h2 class="archive-title">🍮 Pudya Gallery</h2>
    <div class="gallery">
        <div class="card"><img src="1212.png" alt="1"><p>Profile 🍮</p></div>
        <div class="card"><img src="pudya.png" alt="2"><p>Pudya 🐾</p></div>
        <div class="card"><img src="Unknown.png.png" alt="3"><p>Art 🎬</p></div>
    </div>

    
    <div class="profile-container">
        <h3>🍮 CHARACTER INFO</h3>
        <p><strong>Species:</strong> Caramel Pudding...</p>
    </div>

   
    <h2 class="archive-title">Other Characters</h2>
    <div class="gallery">
        <div class="card"><img src="Yutsuko.png.png" alt="1"><p>Yutsuko 🍙</p></div>
        <div class="card"><img src="misakura.png.png" alt="2"><p>Misakura ✨</p></div>
        <div class="card"><img src="kim.png.png" alt="3"><p>Kim 🧢</p></div>
        <div class="card"><img src="aiko.png.png" alt="4"><p>Aiko 🌸</p></div>
        <div class="card"><img src="yumeni.png.png" alt="5"><p>Yumeni 💫</p></div>
        <div class="card"><img src="pudya2.png.png" alt="6"><p>Pudya 🍮</p></div>
    </div>
</body>
</html>
