<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Pink Pudding Studio</title>
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        h1 { color: #ff69b4; font-size: 42px; margin-bottom: 5px; }
        .logo-gif { width: 100%; max-width: 450px; height: auto; margin: 15px auto; display: block; border-radius: 10px; }
        .description { font-size: 18px; color: #ccc; max-width: 600px; margin: 0 auto 40px auto; line-height: 1.6; }
        .archive-title { color: #ff69b4; font-size: 28px; margin: 40px 0 20px 0; text-transform: uppercase; letter-spacing: 2px; }
        .gallery { display: flex; flex-wrap: wrap; justify-content: center; gap: 25px; max-width: 1200px; margin: 0 auto; }
        .card { background: #1e1e1e; padding: 15px; border-radius: 12px; width: 300px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center; }
        .card img { width: 100%; border-radius: 8px; display: block; height: auto; }
        .card p { font-size: 14px; color: #aaa; margin-top: 12px; line-height: 1.4; }
    </style>
</head>
<body>

    <h1>ピンクプリンスタジオ</h1>

    <img src="logo.gif" alt="Pink Pudding Studio Logo" class="logo-gif">
    
    <p class="description">こんにちは！これは私の個人スタジオです。ここでは、私のイラスト、アニメーション、そしてミームを投稿しています。誰かが私のサイトでインスピレーションを見つけてくれたら嬉しいです！🍮</p>

    <h2 class="archive-title">イラスト＆ミームアーカイブ</h2>

    <div class="gallery">
        
        <div class="card">
            <img src="pudya11.png" alt="Pudya Info Sheet">
            <p>プディヤ — キャラクター設定資料と世界観 🍮</p>
        </div>

        <div class="card">
            <img src="pudya.png" alt="Pudya Mascot">
            <p>スタジオのマスコット、プディヤに会いましょう！🐾</p>
        </div>

    </div>

</body>
</html>
